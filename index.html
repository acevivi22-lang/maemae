<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fixfolio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">

<style>
/* VOICE: calm personal-finance app, quiet and clear
   IDEA: a pocket portfolio — each flip is one holding
   PICTURE: soft ring of where the money went, per portfolio and per project
   COLOUR and TYPE: cool grey ground, white cards, muted green/blue/amber; system sans
   LAYOUT: one phone column up to 520px, floating tab bar */
:root{color-scheme:light dark;--bg:light-dark(#eef0f4,#101216);--card:light-dark(#fff,#1a1d23);--ink:light-dark(#1c2029,#e8eaee);--mute:light-dark(#888e99,#8f95a1);--line:light-dark(#e6e8ed,#2a2e36);--soft:light-dark(#f3f4f7,#23272e);--green:#5cb27c;--blue:#5f8fe0;--amber:#e9a462;--rose:#d9837a;--slate:light-dark(#c3c8d1,#4d535e);--dark:light-dark(#20242c,#eceef2);--dink:light-dark(#fff,#15171b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom))}
h1{font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:10px 2px 18px;text-wrap:balance}
h2{font-size:20px;margin:0 0 6px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 1px 2px rgba(20,25,35,.04),0 8px 24px rgba(20,25,35,.05)}
.big{display:flex;align-items:center;gap:14px;width:100%;padding:20px;border:0;border-radius:24px;background:var(--dark);color:var(--dink);font:inherit;text-align:left;cursor:pointer;min-height:88px}
.big b{font-size:19px;display:block}.big small{opacity:.7;font-size:14px}
.big .ico{background:rgba(127,127,127,.18)}
.ring{position:relative;width:min(250px,68vw);aspect-ratio:1;margin:6px auto 2px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 40px}
.ring .c b{font-size:clamp(24px,7.5vw,34px);letter-spacing:-.02em;white-space:nowrap}
.ring .c span{color:var(--mute);font-size:13px}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;color:var(--mute);margin:10px 0 4px}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.lg b{color:var(--ink);font-weight:600}
.sec{font-size:17px;font-weight:650;margin:26px 2px 12px}
.list{display:grid;gap:12px}
.pcard{display:block;width:100%;text-align:left;border:0;font:inherit;color:inherit;cursor:pointer}
.row{display:flex;align-items:center;gap:12px}
.ico{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--blue)}
.grow{flex:1}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:14px}
.amt{font-weight:700;font-size:18px;white-space:nowrap;text-align:right}
.pill{display:inline-flex;gap:4px;font-size:13px;padding:2px 9px;border-radius:99px;background:var(--soft);white-space:nowrap;margin-top:4px;float:right}
.up{color:var(--green)}.dn{color:var(--rose)}
.bar{height:8px;border-radius:99px;background:var(--soft);margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(496px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;padding:6px;box-shadow:0 10px 30px rgba(20,25,35,.12);z-index:5}
.tabs button{border:0;background:none;font:inherit;font-size:12px;color:var(--mute);display:grid;justify-items:center;gap:2px;padding:6px 0;min-height:54px;cursor:pointer;border-radius:22px}
.tabs button.on{color:var(--blue);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:18px;padding:13px 15px}.stat span{display:block;color:var(--mute);font-size:13px}.stat b{font-size:16px;white-space:nowrap}
.stat.hi{background:var(--dark);color:var(--dink);grid-column:1/-1}.kv b{text-align:right}.stat.hi span{color:inherit;opacity:.7}
.btn{border:0;border-radius:16px;padding:0 18px;min-height:50px;font:inherit;font-weight:600;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,25,35,.05)}
.btn.pri{background:var(--dark);color:var(--dink)}.btn.warn{color:var(--rose);background:var(--soft);box-shadow:none}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px;border-radius:12px;background:var(--soft);box-shadow:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;font:inherit;color:var(--mute);padding:6px 0;min-height:44px;cursor:pointer}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0;padding-top:2px}.li:last-child{padding-bottom:2px}
.cat{margin:12px 0}.cat:first-child{margin-top:0}.cat .row{justify-content:space-between;font-size:15px}.cat .bar{margin-top:8px;height:7px}
.tl{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;font-size:15px}.tl span{color:var(--mute)}.tl b{font-weight:600;text-align:right;white-space:nowrap}
.hero{text-align:center;padding:26px 18px}.hero b{display:block;font-size:clamp(30px,9vw,40px);letter-spacing:-.02em;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}.kv:first-child{border-top:0}.kv span{color:var(--mute)}.kv b{font-weight:600;white-space:nowrap}
.yr{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}.yr b{font-size:18px;min-width:70px;text-align:center}
.br{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) auto;gap:8px;align-items:end;margin-bottom:8px}
.br small{grid-column:1/-1;color:var(--mute);font-size:13px;margin:-4px 2px 6px}
.alert{background:color-mix(in srgb,var(--amber) 15%,var(--card));border-radius:18px;padding:14px 16px;font-size:14px;margin-top:12px;line-height:1.5}.alert b{display:block;font-size:15px;margin-bottom:2px}
.alert.ok{background:color-mix(in srgb,var(--green) 13%,var(--card))}
.wpill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin-top:5px;background:color-mix(in srgb,var(--amber) 20%,var(--card));color:light-dark(#9a5d1f,#f0c08d);white-space:nowrap}
.three{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1.3fr);gap:10px}
details.mat summary{list-style:none;cursor:pointer}details.mat summary::-webkit-details-marker{display:none}
.mstat{display:flex;justify-content:space-between;gap:8px;background:var(--soft);border-radius:14px;padding:10px 14px;margin-top:14px;font-size:13px;color:var(--mute)}.mstat b{color:var(--ink);font-size:14px}
.opt{display:block;width:100%;text-align:left;padding:15px 18px;border-radius:16px;border:1px solid var(--line);background:var(--soft);font:inherit;font-size:16px;color:var(--ink);margin-top:10px;min-height:56px;cursor:pointer}
.opt.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--card));font-weight:600}
.wz-top{display:flex;justify-content:space-between;align-items:center}.wz-bar{height:6px;border-radius:99px;background:var(--soft);margin:4px 0 18px;overflow:hidden}.wz-bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.whint{margin-top:12px;font-size:14px;color:var(--mute);min-height:1em;line-height:1.6}
.stat.tap{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}.stat.tap span{color:var(--blue)}
details.bd summary{list-style:none;cursor:pointer}details.bd summary::-webkit-details-marker{display:none}.kv.sub2{font-size:14px;padding:7px 0 7px 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:16px;padding:4px;gap:4px}.seg button{border:0;background:none;font:inherit;font-size:14px;color:var(--mute);min-height:42px;border-radius:12px;cursor:pointer}.seg button.on{background:var(--dark);color:var(--dink);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}.cal .wd{font-size:12px;color:var(--mute);padding:4px 0}
.day{border:0;background:none;font:inherit;color:var(--ink);min-height:46px;border-radius:12px;display:grid;justify-items:center;align-content:center;gap:3px;cursor:pointer;padding:4px 0}.day span{font-size:15px}.day i{display:flex;gap:2px;height:6px}.day.today span{color:var(--blue);font-weight:700}.day.sel{background:var(--soft);outline:1.5px solid var(--blue)}
.dot{width:6px;height:6px;border-radius:50%;display:block}.dot.m{background:var(--amber)}.dot.w{background:var(--blue)}.dot.o{background:var(--slate)}.dot.p{background:var(--green)}
.spark{width:100%;height:46px;display:block}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 4px;font-weight:600;font-size:15px}
.wrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) 46px 46px 36px;gap:6px;margin-top:6px}.xrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 36px;gap:6px;margin-top:6px}
.wrow input,.xrow input{padding:10px 10px;min-height:44px}.x{border:0;background:var(--soft);border-radius:12px;font-size:20px;color:var(--mute);cursor:pointer;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:0 12px;min-height:36px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}.chip:active{background:var(--soft)}.chips .kr{font-size:13px;color:var(--blue);margin-left:4px;font-weight:600}
.acw{position:relative}.ghost{position:absolute;inset:0;padding:0 15px;font-size:16px;white-space:pre;overflow:hidden;color:var(--mute);pointer-events:none;display:flex;align-items:center;z-index:1}.ghost i{font-style:normal;color:transparent}
.wrow .ghost,.xrow .ghost{padding:0 11px}
.acl{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(20,25,35,.16);z-index:40;display:none;max-height:300px;overflow-y:auto}.acl.on{display:block}
.wrow .acl,.xrow .acl{min-width:260px}
.aci{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:11px 14px;min-height:46px;text-align:left;cursor:pointer}.aci+.aci{border-top:1px solid var(--line)}.aci.hi{background:var(--soft)}.aci b{color:var(--blue);font-weight:700}.aci small{color:var(--mute);font-size:12px;white-space:nowrap;align-self:center;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.lrow{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 6px}.lrow label{margin:0}.dqb{border:1px solid var(--line);background:var(--card);border-radius:99px;font:inherit;font-size:12px;padding:0 10px;margin-left:4px;color:var(--ink);cursor:pointer;min-height:28px}
.acts3{display:grid;grid-template-columns:1fr 1.3fr 52px;gap:8px;margin-top:20px}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:99px;background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:0 22px 0 16px;min-height:56px;display:flex;align-items:center;gap:6px;box-shadow:0 10px 24px rgba(40,70,140,.32);cursor:pointer}
.app{padding-bottom:calc(180px + env(safe-area-inset-bottom))}
.qa{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--soft);border-radius:18px;padding:14px;margin-top:10px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;min-height:68px}.qa b{display:block;font-size:16px}.qa small{color:var(--mute);font-size:13px}.qa .ico{background:var(--card)}
.acts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:-6px 0 16px}.apill{border:0;border-radius:14px;background:var(--card);font:inherit;font-size:14px;font-weight:600;min-height:46px;color:var(--ink);cursor:pointer;box-shadow:0 1px 2px rgba(20,25,35,.05)}.apill:first-child,.apill:nth-child(2){color:var(--blue)}
.lib{width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;padding-left:0;padding-right:0}button.li{border-top:1px solid var(--line)}button.li:first-child{border-top:0}.chev{color:var(--mute);display:flex}
.rdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;margin-right:10px}.rdot.r{background:var(--rose)}.rdot.a{background:var(--amber)}.rdot.g{background:var(--slate)}
details.rki{border-top:1px solid var(--line);padding:12px 0}details.rki:first-of-type{margin-top:8px}details.rki summary{display:flex;align-items:center;gap:6px;list-style:none;cursor:pointer;font-size:15px}details.rki summary::-webkit-details-marker{display:none}details.rki summary b{white-space:nowrap}
details.rki .sub{margin:8px 0 0 18px;font-size:14px}details.rki .how{margin:6px 0 0 18px;font-size:14px;color:var(--blue)}
.rline{display:block;font-size:14px;padding:6px 0;color:inherit}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.note{font-size:13px;color:var(--mute);margin:16px 4px;line-height:1.6}
.sheet{position:fixed;inset:0;background:rgba(10,12,16,.38);display:none;align-items:flex-end;justify-content:center;z-index:10}.sheet.open{display:flex}
.panel{background:var(--card);width:min(520px,100%);border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mute);margin:12px 2px 6px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);min-height:48px}
.acts{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:20px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dark);color:var(--dink);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
.toast.on{opacity:1}
.banner{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--mute);margin-bottom:12px}
@media (prefers-reduced-motion:no-preference){.ring circle{transition:stroke-dasharray .5s ease,stroke-dashoffset .5s ease}}
</style>

<body>
<main class="app" id="app"><div class="empty">불러오는 중…</div></main>
<nav class="tabs" id="tabs" aria-label="메뉴"></nav>
<button class="fab" id="fab" data-fab aria-label="기록하기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>기록</button>
<div class="sheet" id="sheet"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=s=>+(String(s??'').replace(/[^\d.\-]/g,''))||0;
const DEF={year:new Date().getFullYear(),deduction:1500000,local:10,brackets:[[0,6],[14e6,15],[5e7,24],[8.8e7,35],[1.5e8,38],[3e8,40],[5e8,42],[1e9,45]]};
const CATS=['취득세·등기','법무사 수수료','중개수수료(복비)','자재비','공사·인건비','재산세','종부세','관리비·공과금','세무비용','이자','기타'];
const ALIAS={'중개·법무':'중개수수료(복비)'};const norm=c=>ALIAS[c.cat]?{...c,cat:ALIAS[c.cat]}:c;
const CAT_DED={'취득세·등기':'필요경비','법무사 수수료':'필요경비','중개수수료(복비)':'필요경비','관리비·공과금':'사업경비','자재비':'필요경비','공사·인건비':'필요경비','재산세':'사업경비','종부세':'사업경비','세무비용':'사업경비','이자':'사업경비','기타':'필요경비'};
const DEDS=['필요경비','사업경비','불공제'];
const STATUS=['진행중','완료','보류'];
const COL={buy:'var(--slate)',need:'var(--blue)',etc:'var(--amber)',tax:'var(--rose)',gain:'var(--green)'};
const S={projects:[],costs:[],set:{...DEF},view:'home',pid:null,db:null,mode:'loading',armed:null,year:new Date().getFullYear(),draft:null};

const I={
house:'<path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19.5z"/>',
grid:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><path d="M16.5 13.5v6M13.5 16.5h6"/>',
tool:'<path d="M14.5 6.5a4 4 0 0 0-5.2 5.2L4 17l3 3 5.3-5.3a4 4 0 0 0 5.2-5.2l-2.5 2.5-2.5-.5-.5-2.5z"/>',
chart:'<path d="M5 20V11M12 20V5M19 20v-6"/>',
box:'<path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/>',
pct:'<circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/><path d="M18 6L6 18"/>',
chev:'<path d="M9 6l6 6-6 6"/>',back:'<path d="M15 6l-6 6 6 6"/>',
coin:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5h5"/>'};
const icon=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

function won(n){n=Math.round(n||0);const s=n<0?'−':'';n=Math.abs(n);let e=Math.floor(n/1e8),m=Math.round(n%1e8/1e4);if(m===10000){e++;m=0}
  if(e&&m)return s+e+'억 '+m.toLocaleString()+'만';if(e)return s+e+'억';if(m)return s+m.toLocaleString()+'만';return s+n.toLocaleString()+'원'}
const full=n=>(n<0?'−':'')+Math.abs(Math.round(n||0)).toLocaleString()+'원';
const pct=x=>isFinite(x)?(x*100).toFixed(1)+'%':'–';
const day=s=>s?new Date(s+'T00:00:00'):null;
const dd=(a,b)=>Math.round((b-a)/864e5);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);

function bk(x){const b=[...S.set.brackets].filter(r=>isFinite(r[0])).sort((a,c)=>a[0]-c[0]);let d=0,prev=0,rate=0,ded=0;
  for(const [l,r] of b){d+=l*(r-prev)/100;prev=r;if(x>=l){rate=r/100;ded=d}}return{rate,ded}}
function tax(x,sur=0){if(x<=0)return 0;const{rate,ded}=bk(x);return x*rate-ded+x*sur}
function calc(p){const cs=S.costs.filter(c=>c.pid===p.id);const sum=k=>cs.filter(c=>c.ded===k).reduce((a,c)=>a+(+c.amount||0),0);

  const gross=sold?+p.sellPrice:(+p.planSellPrice||0),vatAmt=p.vat==='과세'?Math.round((+p.vatBase||0)*.1):0,vatIn=p.vat==='과세'&&p.vatIncl==='포함'?vatAmt:0;

function riskCard(p){const rs=risks(p),n=rs.filter(x=>x.lv!=='g').length;

function annual(y){const inY=s=>s&&+String(s).slice(0,4)===y;const sold=S.projects.filter(p=>inY(p.sellDate)&&(+p.sellPrice||0)>0).map(p=>({p,c:calc(p)}));
  const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);const biz=sum(S.costs.filter(c=>c.ded==='사업경비'&&inY(c.date)),c=>+c.amount||0),common=sum(S.costs.filter(c=>!c.pid&&inY(c.date)),c=>+c.amount||0);
  const Y0=new Date(y,0,1),Y1=new Date(y+1,0,1),rentY=sum(S.projects,p=>rentCalc(p,Y0,Y1).inc);
  const taxable=sum(sold,x=>x.c.taxable),income=taxable+rentY-biz,base=Math.max(0,income-S.set.deduction),cm=sold.filter(x=>x.c.cmp);
  const normal=tax(base),alt=cm.length?sum(cm,x=>x.c.yangNat)+tax(Math.max(0,income-sum(cm,x=>x.c.taxable)-S.set.deduction)):0,cmpUsed=alt>normal;
  const nat=Math.max(normal,alt),loc=nat*S.set.local/100,total=nat+loc,pre=sum(sold,x=>x.c.preTax),net=sum(sold,x=>x.c.pre-x.c.rent.inc)+rentY-common-total,inv=sum(sold,x=>x.c.cost);
  const vat=sum(sold,x=>x.c.vatAmt),hold=sum(S.costs.filter(c=>(c.cat==='재산세'||c.cat==='종부세')&&inY(c.date)),c=>+c.amount||0);
  return{sold,biz,taxable,income,base,rate:base>0?bk(base).rate:0,nat,loc,total,pre,diff:total-pre,net,roi:inv?net/inv:NaN,vat,hold,cmpUsed,normal,alt,rentY}}

  <div class="acts"><button class="btn pri" type="submit">저장</button><button class="btn" type="button" data-close>취소</button></div></form>`)}

document.addEventListener('input',e=>{const t=e.target;if(t.id==='p-ar'){const a=num(t.value),o=$('#p-o8'),hh=$('#p-ar-h');if(a&&o)o.value=a>85?'초과':'이하';if(hh)hh.textContent=a?'약 '+pyeong(a)+'평 · '+(a>85?'85㎡ 초과':'85㎡ 이하'):''}if(t.dataset&&t.dataset.ac&&document.activeElement===t)acUpdate(t);if(t.closest&&t.closest('#wz'))setTimeout(wzHint,0);if(t.classList.contains('money')){const d=t.value.replace(/[^\d]/g,'');t.value=d?(+d).toLocaleString():'';if(t===chipFor)krShow(t)}
  if(t.id==='m-q'||t.id==='m-up')calcAmt();if(t.id==='m-n')matHint();if(t.id==='k-n')wkHint();if(t.closest&&t.closest('#wk,#wz')&&(t.closest('.wrow,.xrow'))){if(t.classList.contains('w-n')){const r=t.closest('.wrow').querySelector('.w-r');if(!r.value){const last=S.costs.filter(c=>c.workers).sort((a,b)=>String(b.date).localeCompare(String(a.date))).flatMap(c=>c.workers).find(w=>w.name===t.value.trim()&&+w.rate);if(last)r.value=(+last.rate).toLocaleString()}}wkTotal()}
  if(t.id==='m-search'){const q=t.value.trim().toLowerCase();document.querySelectorAll('details.mat').forEach(d=>d.style.display=!q||d.dataset.name.includes(q)?'':'none')}
  if(S.draft){if(t.dataset.dk)S.draft[t.dataset.dk]=num(t.value);if(t.dataset.bl)S.draft.brackets[+t.dataset.bl][0]=num(t.value);if(t.dataset.br)S.draft.brackets[+t.dataset.br][1]=num(t.value)}});
document.addEventListener('change',e=>{if(e.target.id==='p-ty'){const v=$('#p-v');if(v&&(e.target.value==='상가'||e.target.value==='오피스텔'))v.value='과세'}if(e.target.id==='imp'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(_){toast('백업 파일을 읽지 못했어요');return}
  if(!d||!Array.isArray(d.projects)){toast('Fixfolio 백업 파일이 아니에요');return}S.pending=d;
  openSheet(`<h2>백업 불러오기</h2><p class="sub">프로젝트 ${d.projects.length}건, 비용 ${(d.costs||[]).length}건이 들어 있어요${d.exportedAt?' ('+esc(String(d.exportedAt).slice(0,10))+' 백업)':''}. 지금 앱에 있는 데이터는 이 백업으로 바뀌어요.</p><div class="acts"><button class="btn pri" data-impok>불러오기</button><button class="btn" data-close>취소</button></div>`)})}if(e.target.id==='m-r'&&e.target.value==='없음'){const d=$('#m-e');if(d)d.value='불공제'}if(e.target.id==='c-c'){const d=$('#c-e');if(d&&CAT_DED[e.target.value])d.value=CAT_DED[e.target.value]}if(S.view==='tax'&&(e.target.dataset.bl||e.target.dataset.br))render()});
document.addEventListener('submit',async e=>{e.preventDefault();if(e.target.id==='wz'){wzNext(e.target,e.submitter);return}
  if(e.target.id==='wk'){const f=e.target,fd=Object.fromEntries(new FormData(f));const workers=[...f.querySelectorAll('.wrow')].map(r=>({name:r.querySelector('.w-n').value.trim(),rate:num(r.querySelector('.w-r').value),count:num(r.querySelector('.w-c').value)||1,days:num(r.querySelector('.w-d').value)||1})).filter(w=>w.name||w.rate);
    const extras=[...f.querySelectorAll('.xrow')].map(r=>({name:r.querySelector('.x-n').value.trim(),amount:num(r.querySelector('.x-a').value)})).filter(x=>x.amount);
    const d={kind:'work',pid:fd.pid,date:fd.date,item:fd.item.trim(),cat:'공사·인건비',workers,extras,amount:wkTotal(),receipt:fd.receipt,ded:fd.receipt==='현금·증빙 없음'?'불공제':fd.ded,memo:fd.memo.trim()};
    if(!d.amount){toast('일당이나 기타 비용을 넣어 주세요');return}S.lastPid=fd.pid;if(await put('costs',S.form&&S.form.id||null,d)){closeSheet();toast(S.form&&S.form.id?'수정했어요':'작업을 기록했어요')}return}const fd=Object.fromEntries(new FormData(e.target));if(!S.form)return;
  if(S.form.k==='p'){const d={name:fd.name.trim(),status:fd.status,buyDate:fd.buyDate,buyPrice:num(fd.buyPrice),planSellDate:fd.planSellDate,planSellPrice:num(fd.planSellPrice),sellDate:fd.sellDate,sellPrice:num(fd.sellPrice),lt:num(fd.lt),region:fd.region,housesBuy:Math.max(1,num(fd.housesBuy)),housesSell:Math.max(1,num(fd.housesSell)),area:num(fd.area),over85:num(fd.area)?(num(fd.area)>85?'초과':'이하'):fd.over85,lowPrice:fd.lowPrice,type:fd.type,rentType:fd.rentType,deposit:num(fd.deposit),monthly:num(fd.monthly),rentStart:fd.rentStart,rentEnd:fd.rentEnd,vat:fd.vat,vatBase:num(fd.vatBase),vatIncl:fd.vatIncl};
    if(d.sellDate&&d.sellPrice&&d.status==='진행중')d.status='완료';if(await put('projects',S.form.id,d)){closeSheet();toast('저장했어요')}}
  else if(S.form.k==='m'){const d={pid:fd.pid,date:fd.date,item:fd.item.trim(),cat:'자재비',store:fd.store.trim(),qty:num(fd.qty),unit:fd.unit.trim(),unitPrice:num(fd.unitPrice),amount:num(fd.amount),receipt:fd.receipt,ded:fd.ded};
    if(!d.amount){toast('금액이나 수량·단가를 넣어 주세요');return}S.lastPid=fd.pid;const eid=S.form.id;if(await put('costs',eid||null,d)){if(eid){closeSheet();toast('수정했어요')}else if(e.submitter&&'more' in e.submitter.dataset){mForm(fd.pid,{pid:fd.pid,date:fd.date,store:d.store,receipt:fd.receipt});toast(d.item+' 저장 · 다음 자재를 넣으세요')}else{closeSheet();toast('자재를 기록했어요')}}}
  else{const d={pid:fd.pid,date:fd.date,item:fd.item.trim(),cat:fd.cat,amount:num(fd.amount),ded:fd.ded};if(!d.amount){toast('금액을 넣어 주세요');return}S.lastPid=fd.pid;const eid=S.form.id;if(await put('costs',eid||null,d)){closeSheet();toast(eid?'수정했어요':'비용을 기록했어요')}}});
document.addEventListener('click',async e=>{const t=e.target.closest('button,[data-open]');if(e.target.id==='sheet'){closeSheet();return}if(!t)return;const ds=t.dataset;
  if(ds.go){S.view=ds.go;S.armed=null;if(ds.go!=='tax')S.draft=null;render();scrollTo(0,0)}
  else if(ds.open){S.pid=ds.open;S.view='detail';closeSheet();render();scrollTo(0,0)}
  else if('newp' in ds)wzStart();
  else if('example' in ds)addExample();
  else if(ds.acpick!==undefined){if(acCur)acAccept(acCur.inp,acCur.items[+ds.acpick].v)}
  else if(ds.dset!==undefined){const d=new Date();d.setDate(d.getDate()+ +ds.dset);const i=$('#'+ds.for);if(i)i.value=iso(d)}
  else if(ds.chip){const inp=chipFor;if(!inp)return;let v=num(inp.value);if(ds.chip==='c')v=0;else if(ds.chip==='000')v=v*1000;else v+=+ds.chip;inp.value=v?v.toLocaleString():'';inp.dispatchEvent(new Event('input',{bubbles:true}));krShow(inp)}
  else if(ds.wpick!==undefined){const st=wzVis().find(s=>s.k===S.wiz.k);if(st.pick)st.pick(ds.wpick,S.wiz.d);else S.wiz.d[st.f]=st.num?+ds.wpick:ds.wpick;if(st.f==='housesBuy'&&!S.wiz.d.housesSell)S.wiz.d.housesSell=+ds.wpick;if(st.f==='type'&&!isHouse({type:ds.wpick})&&!S.wiz.d.vat)S.wiz.d.vat='과세';wzGo(1)}
  else if('wback' in ds)wzGo(-1);
  else if(ds.costbd)costSheet(ds.costbd);
  else if('export' in ds)exportData();
  else if('xlsx' in ds)exportXlsx();
  else if('import' in ds)$('#imp').click();
  else if('impok' in ds){apply(S.pending);S.pending=null;persist();closeSheet();S.view='home';render();toast('백업을 불러왔어요')}
  else if(ds.editp!==undefined)pForm(S.projects.find(p=>p.id===ds.editp));
  else if(ds.addcost!==undefined)cForm(ds.addcost||(S.view==='detail'?S.pid:''),ds.date);
  else if(ds.addwork!==undefined){const pid=ds.addwork||(S.view==='detail'?S.pid:null);wzStartW({...(pid!=null?{pid}:{}),...(ds.date?{date:ds.date}:{})},pid!=null?'date':'pid')}
  else if(ds.wagain){const c=S.costs.find(x=>x.id===ds.wagain);if(c)wzStartW({pid:c.pid,item:c.item,workers:JSON.parse(JSON.stringify(c.workers||[])),extras:JSON.parse(JSON.stringify(c.extras||[])),ded:c.ded,receipt:c.receipt,loaded:true},'date')}
  else if(ds.wkload)wkFill(ds.wkload);
  else if(ds.addrow){$(ds.addrow==='w'?'#wk-rows':'#ex-rows').insertAdjacentHTML('beforeend',ds.addrow==='w'?wrow():xrow());wkTotal()}
  else if('rowdel' in ds){t.parentElement.remove();wkTotal()}
  else if(ds.stab){S.stab=ds.stab;render()}
  else if(ds.day){S.cal.sel=ds.day;render()}
  else if(ds.cm){const c=S.cal;c.m+=+ds.cm;if(c.m<0){c.m=11;c.y--}if(c.m>11){c.m=0;c.y++}c.sel=`${c.y}-${String(c.m+1).padStart(2,'0')}-01`;render()}
  else if(ds.addmat!==undefined){const pid=ds.addmat||(S.view==='detail'?S.pid:null);wzStartM({...(pid!=null?{pid}:{}),...(ds.date?{date:ds.date}:{})},pid!=null?'date':'pid')}
  else if(ds.area){const i=$('#w-ar');if(i){i.value=ds.area;wzHint()}}
  else if(ds.unit){const u=$('#w-u');if(u)u.value=ds.unit;$('#w-up')?.focus()}
  else if(ds.again){const c=S.costs.find(x=>x.id===ds.again);if(c)wzStartM({pid:c.pid,item:c.item,unit:c.unit,unitPrice:+c.unitPrice||0,store:c.store,receipt:c.receipt,ded:c.ded},'date')}
  else if('close' in ds)closeSheet();
  else if('fab' in ds){const pid=S.view==='detail'?S.pid:'';openSheet(`<h2>무엇을 기록할까요?</h2>${pid?`<p class="sub">${esc(pname(pid))}에 기록돼요</p>`:''}<div style="margin-top:8px">${[['addmat','box','자재 구매','수량 · 단가 · 구매처'],['addwork','tool','작업 · 인건비','인원 · 일당 · 기타 비용'],['addcost','coin','기타 비용','이자 · 관리비 · 수수료 등'],...(pid?[]:[['newp','house','새 프로젝트','집 한 채를 새로 시작']])].map(([k,ic,l,s])=>`<button class="qa" data-${k}="${k==='newp'?'':esc(pid)}"><span class="ico">${icon(ic)}</span><span class="grow"><b>${l}</b><small>${s}</small></span>${icon('chev',18)}</button>`).join('')}</div><button class="btn" data-close style="width:100%;margin-top:14px">닫기</button>`)}
  else if(ds.cost){costOne(ds.cost)}
  else if(ds.cedit){const c=S.costs.find(x=>x.id===ds.cedit);if(c){if(c.kind==='work')wForm(c.pid,JSON.parse(JSON.stringify(c)));else if(c.cat==='자재비')mForm(c.pid,{...c});else cForm(c.pid,c.date,{...c})}}
  else if(ds.cdel){if(S.armed!==ds.cdel){S.armed=ds.cdel;costOne(ds.cdel,1);return}S.armed=null;closeSheet();await del('costs',ds.cdel);toast('삭제했어요')}
  else if(ds.delcost){if(S.armed!==ds.delcost){S.armed=ds.delcost;render();return}S.armed=null;await del('costs',ds.delcost);toast('삭제했어요')}
  else if(ds.delp){if(S.armed!==ds.delp){S.armed=ds.delp;t.textContent='한 번 더 누르면 비용 기록까지 삭제돼요';return}const id=ds.delp;closeSheet();
    for(const c of S.costs.filter(c=>c.pid===id))await del('costs',c.id);await del('projects',id);S.view='home';render();toast('삭제했어요')}
  else if(ds.yr){S.year+=+ds.yr;render()}
  else if(ds.bdel!==undefined){S.draft.brackets.splice(+ds.bdel,1);render()}
  else if('badd' in ds){const b=S.draft.brackets,last=b[b.length-1]||[0,0];b.push([last[0]*2||1e7,last[1]]);render()}
  else if('treset' in ds){S.draft={deduction:DEF.deduction,local:DEF.local,brackets:DEF.brackets.map(r=>[...r])};render();toast('기본값을 불러왔어요. 저장을 눌러 적용하세요')}
  else if('tsave' in ds){const d={deduction:S.draft.deduction,local:S.draft.local,brackets:S.draft.brackets.map(([l,r])=>({l,r}))};
    S.set={...S.set,deduction:d.deduction,local:d.local,brackets:S.draft.brackets.map(r=>[...r])};persist();
    S.draft=null;render();toast('세율을 저장했어요')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let chipFor=null;
function krShow(t){const k=document.querySelector('.chips:not(.uchips) .kr');if(k){const v=num(t.value);k.textContent=v>=1e4?'= '+won(v)+'원':''}}
document.addEventListener('focusin',e=>{const t=e.target;if(!t.classList||!t.classList.contains('money'))return;if(chipFor===t&&document.querySelector('.chips'))return;document.querySelectorAll('.chips:not(.uchips)').forEach(c=>c.remove());chipFor=t;
  const at=t.closest('.two,.three,.wrow,.xrow')||t;at.insertAdjacentHTML('afterend',`<div class="chips">${[['100000000','+1억'],['10000000','+1천만'],['1000000','+100만'],['100000','+10만'],['10000','+1만'],['000','000'],['c','지움']].map(([v,l])=>`<button type="button" class="chip" data-chip="${v}">${l}</button>`).join('')}<span class="kr"></span></div>`);krShow(t)});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!a||!a.classList||!a.classList.contains('money')){document.querySelectorAll('.chips:not(.uchips)').forEach(c=>c.remove());chipFor=null}},200));
for(const ev of['pointerdown','mousedown'])document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('.chip'))e.preventDefault()});

load();S.mode='ready';render();
try{navigator.storage?.persist?.()}catch(_){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
